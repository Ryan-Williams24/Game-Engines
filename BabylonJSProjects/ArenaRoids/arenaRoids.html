<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArenaRoids - Babylon.js</title>
    <style>
        html,
        body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: black;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
    <!-- Babylon.js Scripts -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
</head>

<body>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        // --- CONFIGURATION VARIABLES (Edit these) ---
        const ASTEROID_COUNT = 40;
        const BASE_SPEED = 0.15; // Initial speed multiplier
        const SPEED_INC = 0.02;  // Speed increment when hitting the outer sphere
        const BIG_SPHERE_RADIUS = 50;
        // --------------------------------------------

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);

            // Camera: POV at center (0,0,0)
            // We use UniversalCamera to allow rotation with mouse
            const camera = new BABYLON.UniversalCamera("camera", new BABYLON.Vector3(0, 0, 0), scene);
            camera.setTarget(BABYLON.Vector3.Zero());
            camera.attachControl(canvas, true);

            // Enable pointer lock for better "look around" experience
            scene.onPointerObservable.add((pointerInfo) => {
                if (pointerInfo.type === BABYLON.PointerEventTypes.POINTERDOWN) {
                    canvas.requestPointerLock();
                }
            });

            // Light
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.7;

            // The Big Sphere (Arena)
            const arena = BABYLON.MeshBuilder.CreateSphere("arena", { radius: BIG_SPHERE_RADIUS, segments: 32 }, scene);
            const arenaMat = new BABYLON.StandardMaterial("arenaMat", scene);
            arenaMat.diffuseColor = new BABYLON.Color3(0, 0, 0.2); // Dark Blue
            arenaMat.specularColor = new BABYLON.Color3(0, 0, 0);
            // Important: Render the inside of the sphere
            arenaMat.backFaceCulling = false;
            arena.material = arenaMat;

            // Asteroid Data Structure
            const asteroids = [];

            class Asteroid {
                constructor() {
                    this.radius = Math.random() * (2.5 - 0.5) + 0.5;
                    this.mesh = BABYLON.MeshBuilder.CreateSphere(`asteroid_${Math.random()}`, { diameter: this.radius * 2 }, scene);

                    const mat = new BABYLON.StandardMaterial("astMat", scene);
                    mat.diffuseColor = new BABYLON.Color3(Math.random(), Math.random(), Math.random());
                    this.mesh.material = mat;

                    // Random position within the sphere, ensuring they don't start outside or touching boundary
                    const maxDist = BIG_SPHERE_RADIUS - this.radius - 2; // buffer of 2m
                    const dist = Math.random() * maxDist;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);

                    this.position = new BABYLON.Vector3(
                        dist * Math.sin(phi) * Math.cos(theta),
                        dist * Math.sin(phi) * Math.sin(theta),
                        dist * Math.cos(phi)
                    );
                    this.mesh.position = this.position;

                    // Random direction and initial speed
                    // Replacement for the broken line:
                    const dir = new BABYLON.Vector3(
                        Math.random() * 2 - 1,
                        Math.random() * 2 - 1,
                        Math.random() * 2 - 1
                    ).normalize();
                   
                    const initialSpeed = (Math.random() * 0.5 + 0.5) * BASE_SPEED;
                    this.velocity = dir.scale(initialSpeed);

                    // Mass for collision calculations (proportional to volume/radius^3)
                    this.mass = Math.pow(this.radius, 3);
                }

                update() {
                    // Move
                    this.position.addInPlace(this.velocity);
                    this.mesh.position.copyFrom(this.position);

                    // Check collision with Big Sphere (Inner surface)
                    const distFromCenter = this.position.length();
                    if (distFromCenter + this.radius >= BIG_SPHERE_RADIUS) {
                        // 1. Collision Normal: Vector from center to asteroid, but pointing INWARD
                        // The normal at the contact point on the sphere is P/|P|. 
                        // Since we are inside, the surface normal points towards the center: -P/|P|
                        const normal = this.position.normalize().scale(-1);

                        // 2. Reflect velocity: v_new = v - 2(v . n)n
                        const dot = BABYLON.Vector3.Dot(this.velocity, normal);
                        if (dot < 0) { // Only reflect if moving towards the wall
                            this.velocity.subtractInPlace(normal.scale(2 * dot));

                            // 3. Add speed increment
                            const currentSpeed = this.velocity.length();
                            const newSpeed = currentSpeed + SPEED_INC;
                            this.velocity.scaleInPlace(newSpeed / currentSpeed);
                        }

                        // Prevent sticking: push back inside the sphere boundary
                        const overlap = (distFromCenter + this.radius) - BIG_SPHERE_RADIUS;
                        this.position.addInPlace(normal.scale(overlap));
                    }
                }
            }

            // Spawn Asteroids
            for (let i = 0; i < ASTEROID_COUNT; i++) {
                asteroids.push(new Asteroid());
            }

            // Collision Loop: Asteroid vs Asteroid
            const resolveAsteroidCollisions = () => {
                for (let i = 0; i < asteroids.length; i++) {
                    for (let j = i + 1; j < asteroids.length; j++) {
                        const a = asteroids[i];
                        const b = asteroids[j];

                        const diff = a.position.subtract(b.position);
                        const distance = diff.length();
                        const minDistance = a.radius + b.radius;

                        if (distance < minDistance) {
                            // Collision detected! 
                            // Elastic collision math
                            const normal = diff.normalize();

                            // Relative velocity
                            const relativeVelocity = a.velocity.subtract(b.velocity);
                            const velocityAlongNormal = BABYLON.Vector3.Dot(relativeVelocity, normal);

                            // Do not resolve if velocities are already separating
                            if (velocityAlongNormal > 0) continue;

                            // Impulse scalar
                            let impulse = -(2 * velocityAlongNormal) / (1 / a.mass + 1 / b.mass);
                            const impulseVec = normal.scale(impulse);

                            // Apply impulse to velocities
                            a.velocity.addInPlace(impulseVec.scale(1 / a.mass));
                            b.velocity.subtractInPlace(impulseVec.scale(1 / b.mass));

                            // Prevent overlap (static resolution)
                            const overlap = minDistance - distance;
                            const separationVec = normal.scale(overlap / 2);
                            a.position.addInPlace(separationVec);
                            b.position.subtractInPlace(separationVec);
                        }
                    }
                }
            };

            // Render Loop
            scene.registerBeforeRender(() => {
                resolveAsteroidCollisions();
                asteroids.forEach(a => a.update());
            });

            return scene;
        };

        const scene = createScene();

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>

</html>
